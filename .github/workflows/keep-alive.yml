name: Keep alive

# P14.15 — calls the API's /health every 5 minutes in store hours (07:00 to 23:00 IST). That keeps
# Render's free API and the Supabase project awake, and a failed run emails the repository owner,
# which is the downtime alert (docs/17-operations.md in the private repo).
#
# Written by the private repo's Publish site workflow: change it there, not here.

on:
  schedule:
    # IST is UTC+5:30, so 07:00 to 23:00 IST is 01:30 to 17:30 UTC.
    # Every 5, not 10: GitHub often starts a scheduled run late, and gaps of 18 to 23 minutes let
    # Render's free plan put the API to sleep (after 15), whose slow wake then failed the check.
    - cron: '30-59/5 1 * * *'
    - cron: '*/5 2-16 * * *'
    - cron: '0-30/5 17 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Call /health
        env:
          HEALTH_URL: https://sunil-store-api.onrender.com/health
        # Three tries of up to 90 seconds: a sleeping API can take over a minute to wake, and two
        # 60-second tries emailed the owner about 3 runs in 100 when nothing was wrong.
        run: |
          for attempt in 1 2 3; do
            if curl -fsS --max-time 90 "$HEALTH_URL" | grep -q '"status":"ok"'; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then
              echo "No answer on try $attempt. The API may be waking up; trying again in 30 seconds."
              sleep 30
            fi
          done
          echo "::error::/health didn't answer ok in three tries: the API or its database is down."
          exit 1
