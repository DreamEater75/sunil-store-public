name: Keep alive

# P14.15 — calls the API's /health every 10 minutes in store hours (07:00 to 23:00 IST). That keeps
# Render's free API and the Supabase project awake, and a failed run emails the repository owner,
# which is the downtime alert (docs/17-operations.md in the private repo).
#
# Written by the private repo's Publish site workflow: change it there, not here.

on:
  schedule:
    # IST is UTC+5:30, so 07:00 to 23:00 IST is 01:30 to 17:30 UTC.
    - cron: '30-59/10 1 * * *'
    - cron: '*/10 2-16 * * *'
    - cron: '0-30/10 17 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call /health
        env:
          HEALTH_URL: https://sunil-store-api.onrender.com/health
        run: |
          check() { curl -fsS --max-time 60 "$HEALTH_URL" | grep -q '"status":"ok"'; }
          if check; then exit 0; fi
          echo "No answer. The API may have been asleep; trying again in 60 seconds."
          sleep 60
          check
